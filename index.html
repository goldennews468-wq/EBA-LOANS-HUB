<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EBA Loans Hub</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

<style>
body{
margin:0;
font-family:'Inter';
background:#020c1b;
color:#fff;
}

/* LOGIN */
.login{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}
.login-box{
background:rgba(255,255,255,0.05);
padding:40px;
border-radius:14px;
width:350px;
backdrop-filter:blur(12px);
}
.login-box input{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:8px;
}
.login-box button{
width:100%;
padding:12px;
background:#1f8cff;
border:none;
border-radius:8px;
color:white;
}

/* APP */
.app{display:none}

/* SIDEBAR */
.sidebar{
width:240px;
height:100vh;
position:fixed;
background:#021024;
padding:20px;
}
.sidebar a{
display:block;
padding:12px;
margin-top:10px;
cursor:pointer;
border-radius:10px;
}
.sidebar a:hover{background:rgba(255,255,255,0.05)}

/* MAIN */
.main{
margin-left:240px;
padding:20px;
}

/* KPI */
.kpis{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
}
.kpi{
padding:20px;
border-radius:12px;
}
.blue{background:#1f8cff}
.green{background:#15b37b}
.orange{background:#ff9f43}
.purple{background:#6f42c1}

/* CARD */
.card{
background:rgba(255,255,255,0.05);
padding:20px;
margin-top:20px;
border-radius:12px;
}

/* TABLE */
table{width:100%}
td,th{padding:10px}

/* BUTTON */
.btn{
padding:10px;
background:#1f8cff;
border:none;
border-radius:8px;
color:white;
cursor:pointer;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login" id="login">
<div class="login-box">
<h2>EBA Loans Hub</h2>
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
</div>
</div>

<!-- APP -->
<div class="app" id="app">

<div class="sidebar">
<h3>EBA</h3>
<a onclick="showTab('dashboard')">Dashboard</a>
<a onclick="showTab('loans')">Loans</a>
<a onclick="showTab('repayments')">Repayments</a>
</div>

<div class="main">

<h2 id="title">Dashboard</h2>

<!-- DASHBOARD -->
<div id="dashboard">

<div class="kpis">
<div class="kpi blue">Loans <h2 id="k1">0</h2></div>
<div class="kpi green">Active <h2 id="k2">0</h2></div>
<div class="kpi orange">Repayments <h2 id="k3">0</h2></div>
<div class="kpi purple">Users <h2 id="k4">0</h2></div>
</div>

<div class="card">
<canvas id="chart"></canvas>
</div>

</div>

<!-- LOANS -->
<div id="loans" style="display:none">

<div class="card">
<h3>Add Loan</h3>
<input id="name" placeholder="Client Name">
<input id="amount" placeholder="Amount">
<button class="btn" onclick="addLoan()">Add Loan</button>
</div>

<div class="card">
<h3>Loans</h3>
<table>
<thead>
<tr><th>Name</th><th>Amount</th><th>Status</th></tr>
</thead>
<tbody id="loanTable"></tbody>
</table>
</div>

</div>

<!-- REPAYMENTS -->
<div id="repayments" style="display:none">

<div class="card">
<h3>Add Repayment</h3>
<input id="loanId" placeholder="Loan ID">
<input id="repAmount" placeholder="Amount">
<button class="btn" onclick="addRep()">Pay</button>
</div>

<div class="card">
<h3>Repayments</h3>
<table>
<thead>
<tr><th>Loan</th><th>Amount</th></tr>
</thead>
<tbody id="repTable"></tbody>
</table>
</div>

</div>

</div>
</div>

<script>
/* FIREBASE CONFIG */
const firebaseConfig = {
apiKey: "YOUR_KEY",
authDomain: "YOUR_DOMAIN",
databaseURL: "YOUR_DB_URL",
projectId: "YOUR_PROJECT_ID"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

/* LOGIN */
function login(){
const email = document.getElementById("email").value;
const pass = document.getElementById("password").value;

auth.signInWithEmailAndPassword(email,pass)
.then(()=>{
document.getElementById("login").style.display="none";
document.getElementById("app").style.display="block";
loadData();
})
.catch(e=>alert(e.message));
}

/* NAV */
function showTab(tab){
document.getElementById("dashboard").style.display="none";
document.getElementById("loans").style.display="none";
document.getElementById("repayments").style.display="none";
document.getElementById(tab).style.display="block";
}

/* ADD LOAN */
function addLoan(){
const name = document.getElementById("name").value;
const amount = document.getElementById("amount").value;

const id = Date.now();

db.ref("loans/"+id).set({
id,name,amount,status:"active"
});
}

/* ADD REPAYMENT */
function addRep(){
const loanId = document.getElementById("loanId").value;
const amount = document.getElementById("repAmount").value;

db.ref("repayments/"+Date.now()).set({
loanId,amount
});
}

/* LOAD DATA */
function loadData(){

db.ref("loans").on("value",snap=>{
const data = snap.val()||{};
let html="";
let total=0, active=0;

Object.values(data).forEach(l=>{
html+=`<tr><td>${l.name}</td><td>${l.amount}</td><td>${l.status}</td></tr>`;
total++;
if(l.status==="active") active++;
});

document.getElementById("loanTable").innerHTML=html;
document.getElementById("k1").innerText=total;
document.getElementById("k2").innerText=active;

});

db.ref("repayments").on("value",snap=>{
const data = snap.val()||{};
let html="";
let total=0;

Object.values(data).forEach(r=>{
html+=`<tr><td>${r.loanId}</td><td>${r.amount}</td></tr>`;
total+=Number(r.amount);
});

document.getElementById("repTable").innerHTML=html;
document.getElementById("k3").innerText=total;

});

/* CHART */
new Chart(document.getElementById("chart"),{
type:"doughnut",
data:{
labels:["Active","Completed"],
datasets:[{
data:[70,30],
backgroundColor:["#1f8cff","#15b37b"]
}]
}
});

}
</script>

</body>
</html>
